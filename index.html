<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="./favicons/Icon.png">
    <link rel="stylesheet" href="./css/style.css">

    <script defer src="./js/script.js"></script>

    <title>Pokedex</title>
</head>
<body>

    <main class="pokedex-container">

        <div class="pokedex-left-container">
            <div class="pokemon-shadow"></div>
            <img src="#" alt="pokemon" class="pokemon-image">
            <img src="./img/pokedex_left.png" alt="Tela da Pokedex" class="pokedex-half">

            <h1 class="pokemon-data">
                <span class="pokemon-number"></span> -
                <span class="pokemon-name"></span>
            </h1>
            <div class="pokemon-types"></div>

        </div>

        <div class="pokedex-right-container">
            <img src="./img/pokedex_right.png" alt="Botões da Pokedex" class="pokedex-half">
            
            <form class="form">
              <input
                 type="search"
                 class="input-search"
                 placeholder="Name or number"
                 required
              />
            </form>

            <div class="buttons">
                <button class="button btn-prev">Prev &lt;</button>
                <button class="button btn-next">&gt; Next </button>
            </div>

        </div>



    </main>
    
</body>
</html>
